<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calculator
  </title>
  <link rel="stylesheet" href="style/calculator.css">
</head>
<body>
  
  <div class="calculator">
    <div class="result"></div>
    <div class="numbers">
      <div class="container">
        <button class="item js-1">1</button>
        <button class="item js-2">2</button>
        <button class="item js-3">3</button>
        <button class="item js-4">4</button>
        <button class="item js-5">5</button>
        <button class="item js-6">6</button>
        <button class="item js-7">7</button>
        <button class="item js-8">8</button>
        <button class="item js-9">9</button>
        <button class="item js-0">0</button>
      </div>
    </div>
    <div class="calcule">
      <div class="container">
        <div class="item1 js-divide">/</div>
        <div class="item1 js-multiply">*</div>
        <div class="item1 js-subtract">-</div>
        <div class="item1 js-add">+</div>
        <div class="item1 js-dot">.</div>
        <button class="button" js-calculate>=</button>
        <button class="button js-delete">delete</button>
        <button class="button js-clear">clear</button>
      
      </div>
    </div>
  </div>
  

  
  <script type="module" src="scripts/calculator.js"></script>
</body>
</html>
